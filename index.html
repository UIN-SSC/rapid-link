<head>

    <!-- Google Fonts for UINSSC Brand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <main class="container">
        <header class="profile">
            <div class="profile-img-container">
                <img src="https://lh3.googleusercontent.com/u/0/d/16qXcKwpqyUeU6sohVY0q-W1sF-SFH6_6" alt="UIN Siber Syekh Nurjati Logo" class="profile-img" draggable="false" oncontextmenu="return false;">
            </div>
            <div class="badge-tagline">One Link in Bio for Endless Information</div>
            <h1>UIN Siber Syekh Nurjati Cirebon</h1>
            <p>PTKIN Siber Pertama di Indonesia Kampus Unggul Berkelas Dunia.</p>
        </header>

        <section class="links-section">
            <h2 class="section-title"><i class="fa-solid fa-link"></i> Rapid Link</h2>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Cari informasi atau tautan..." onkeyup="filterLinks()">
            </div>

            <!-- Skeleton Loaders -->
            <div id="links-container">
                <div class="link-card skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-text"></div>
                </div>
                <div class="link-card skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-text"></div>
                </div>
                <div class="link-card skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-text" style="width: 50%;"></div>
                </div>
                <div class="link-card skeleton-card">
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-text" style="width: 80%;"></div>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 UIN Siber Syekh Nurjati Cirebon. Powered by PPID UIN Siber Syekh Nurjati Cirebon.</p>
        </footer>
    </main>

    <script>
        // URL Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbxv7q-NKn8ue8XXqQwLP8mTXkIQyfgumgzYZ5NKZURSXuPcpxgGG_wem1hHcr-tpzWv/exec";

        // Fungsi render untuk menampilkan link ke HTML
        function renderLinks(data, container) {
            container.innerHTML = ''; // Hapus skeleton/data lama
            data.forEach(item => {
                const a = document.createElement('a');
                a.href = item.url;
                a.className = item.isPriority ? 'link-card priority-card' : 'link-card';
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                
                let iconClass = item.icon.trim();
                if (!iconClass.includes('fa-')) iconClass = 'fa-link';
                if (!iconClass.includes('fa-solid') && !iconClass.includes('fa-brands')) iconClass = 'fa-solid ' + iconClass;

                let iconBgClass = '';
                if (iconClass.includes('fa-file-pdf')) iconBgClass = 'pdf';
                if (iconClass.includes('fa-file-word')) iconBgClass = 'word';
                if (iconClass.includes('fa-file-excel')) iconBgClass = 'excel';
                if (iconClass.includes('fa-drive') || iconClass.includes('fa-google-drive')) iconBgClass = 'drive';
                if (iconClass.includes('fa-whatsapp')) iconBgClass = 'whatsapp';
                if (iconClass.includes('fa-telegram')) iconBgClass = 'telegram';
                if (iconClass.includes('fa-instagram')) iconBgClass = 'instagram';
                if (iconClass.includes('fa-youtube')) iconBgClass = 'youtube';
                if (iconClass.includes('fa-facebook')) iconBgClass = 'facebook';
                if (iconClass.includes('fa-tiktok')) iconBgClass = 'tiktok';

                a.innerHTML = `
                    <div class="link-icon ${iconBgClass}"><i class="${iconClass}"></i></div>
                    <div class="link-content">
                        <h3>${item.title}</h3>
                    </div>
                    <div class="link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                `;
                container.appendChild(a);
            });
        }

        // Fetch data dengan sistem CACHE (Stale-While-Revalidate)
        async function fetchLinks() {
            const container = document.getElementById('links-container');
            const cachedData = localStorage.getItem('uinssc_links_cache');
            
            // 1. Tampilkan data dari Cache secara INSTAN (0 detik loading) jika ada
            if (cachedData) {
                renderLinks(JSON.parse(cachedData), container);
            }
            
            // 2. Ambil data terbaru dari Server di latar belakang secara diam-diam
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // 3. Jika ada perubahan data baru, Update UI & Cache
                if (cachedData !== JSON.stringify(data)) {
                    localStorage.setItem('uinssc_links_cache', JSON.stringify(data));
                    renderLinks(data, container);
                }
            } catch (error) {
                console.error("Gagal memuat data latar belakang:", error);
                // Hanya tampilkan error merah jika cache kosong (pengguna baru pertama kali buka web saat offline)
                if (!cachedData) {
                    container.innerHTML = `
                        <div style="text-align:center; padding: 2rem 0;">
                            <i class="fa-solid fa-circle-exclamation" style="color: red; font-size: 2rem; margin-bottom: 10px;"></i><br>
                            <span style="color: red;">Gagal memuat data tautan. Periksa koneksi internet Anda.</span>
                        </div>
                    `;
                }
            }
        }

        // Jalankan fetch saat halaman dimuat
        fetchLinks();

        // Fitur pencarian
        function filterLinks() {
            let input = document.getElementById('searchInput');
            let filter = input.value.toLowerCase();
            let cards = document.getElementsByClassName('link-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName("h3")[0];
                if (title && title.innerText.toLowerCase().indexOf(filter) > -1) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>

</html>
